services:
  pulseremind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseremind
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - PORT=3456
      - NODE_ENV=production
      - STORAGE_PROVIDER=sqlite
      - PULSEREMIND_DB_PATH=/app/data/pulseremind.db
      # Optional: Uncomment and provide credentials for cloud hybrid sync
      # - SUPABASE_URL=https://your-project.supabase.co
      # - SUPABASE_SERVICE_ROLE_KEY=your_service_role_key
      # - RESEND_API_KEY=re_your_api_key
      # - NTFY_TOPIC=pulseremind-mydevice
    volumes:
      - pulseremind-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3456/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

volumes:
  pulseremind-data:
    driver: local
