name: Bug Report
description: File a bug report or resolution false positive
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you have checked the existing open issues before submitting.
  - type: input
    id: version
    attributes:
      label: PulseRemind Version or Commit Hash
      placeholder: "e.g., 1.0.0 or commit b21c716"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime Environment
      placeholder: "Node.js 22.12 / macOS / Docker / Linux"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide exact steps, tool call parameters, or target URLs.
      placeholder: |
        1. Call create_opportunity_watch with target_url '...'
        2. Execute check_watch_now
        3. Observed error or unexpected state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
